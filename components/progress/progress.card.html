<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);padding:16px}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.t{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;justify-content:center;min-height:120px}.t.dk{background:#000}.bar{height:6px;border-radius:3px;background:rgba(120,120,128,0.2);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:rgb(0,136,255)}.dk .bar{background:rgba(120,120,128,0.36)}.dk .bar i{background:rgb(0,145,255)}.st{display:flex;align-items:center;gap:10px;font-size:15px;line-height:20px;color:rgba(60,60,67,0.6)}.dk .st{color:rgba(235,235,245,0.6)}.sp{width:20px;height:20px;position:relative;animation:r 1s steps(8) infinite}.sp b{position:absolute;left:9px;top:0;width:2.5px;height:6px;border-radius:2px;background:currentColor;transform-origin:1.25px 10px}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="grid">
<div><div class="t "><div class="bar"><i style="width:25%"></i></div><div class="bar"><i style="width:60%"></i></div><div class="st"><span class="sp"><b style="transform:rotate(0deg);opacity:0.25"></b><b style="transform:rotate(45deg);opacity:0.35"></b><b style="transform:rotate(90deg);opacity:0.45"></b><b style="transform:rotate(135deg);opacity:0.55"></b><b style="transform:rotate(180deg);opacity:0.65"></b><b style="transform:rotate(225deg);opacity:0.75"></b><b style="transform:rotate(270deg);opacity:0.8500000000000001"></b><b style="transform:rotate(315deg);opacity:0.9500000000000001"></b></span>Status…</div></div><div class="lbl">Light · 25% / 60% / Activity</div></div><div><div class="t dk"><div class="bar"><i style="width:25%"></i></div><div class="bar"><i style="width:60%"></i></div><div class="st"><span class="sp"><b style="transform:rotate(0deg);opacity:0.25"></b><b style="transform:rotate(45deg);opacity:0.35"></b><b style="transform:rotate(90deg);opacity:0.45"></b><b style="transform:rotate(135deg);opacity:0.55"></b><b style="transform:rotate(180deg);opacity:0.65"></b><b style="transform:rotate(225deg);opacity:0.75"></b><b style="transform:rotate(270deg);opacity:0.8500000000000001"></b><b style="transform:rotate(315deg);opacity:0.9500000000000001"></b></span>Status…</div></div><div class="lbl">Dark · 25% / 60% / Activity</div></div>
</div></body></html>
