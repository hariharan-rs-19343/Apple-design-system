<!-- @dsCard group="Components" viewport="700x330" name="Sheets" subtitle="Full-screen sheet (stacked / not stacked), inspector sheet with Liquid Glass, iPad sheet, overlay" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);min-height:100vh;display:flex;justify-content:center;padding:14px}
.stage{position:relative;width:2500px;height:1200px;zoom:0.268;flex-shrink:0}
.abs{position:absolute}
.sheet{background:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.tb{width:100%;height:70px;position:relative;flex-shrink:0}
.grab{position:absolute;left:50%;top:5px;width:36px;height:5px;margin-left:-18px;border-radius:100px;background:rgb(204,204,204)}
.btn{position:absolute;top:16px;width:44px;height:44px;border-radius:296px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.btn.l{left:16px;background:rgba(120,120,128,0.16);color:rgb(114,114,114)}
.btn.r{right:16px;background:rgb(0,136,255);color:#fff;font-weight:600}
.ttl{position:absolute;left:76px;right:76px;top:27px;text-align:center;font-size:17px;font-weight:590;line-height:22px;letter-spacing:-0.43px;color:rgb(0,0,0)}
.lbl{position:absolute;font-size:44px;color:rgba(60,60,67,0.6);text-align:center}
</style></head><body>
<div class="stage">
<div class="abs" style="left:60px;top:60px;width:890px;height:890px;border-radius:5px;overflow:hidden;background:rgba(0,0,0,0.02)">
<div class="abs sheet" style="left:20px;top:20px;width:402px;height:852px;border-radius:38px 38px 0 0;box-shadow:0 15px 75px rgba(0,0,0,0.18)">
<div class="tb"><i class="grab"></i><span class="btn l">✕</span><span class="ttl">Title</span><span class="btn r">↑</span></div></div>
<div class="abs" style="left:470px;top:20px;width:402px;height:852px">
<div class="abs sheet" style="left:16px;top:0;width:370px;height:852px;border-radius:38px 38px 9.5px 9.5px"><div style="flex:1;align-self:stretch;background:rgba(0,0,0,0.1)"></div></div>
<div class="abs sheet" style="left:0;top:10px;width:402px;height:842px;border-radius:38px 38px 9.5px 9.5px;box-shadow:0 15px 75px rgba(0,0,0,0.18)">
<div class="tb"><i class="grab"></i><span class="btn l">✕</span><span class="ttl">Title</span><span class="btn r">↑</span></div></div>
</div>
</div>
<div class="lbl" style="left:60px;top:970px;width:890px">Full screen · Not stacked / Stacked</div>
<div class="abs" style="left:1000px;top:60px;width:402px;height:387px;padding:0 6px 6px">
<div class="abs" style="left:6px;top:0;width:390px;height:381px;border-radius:38px;background:rgba(160,160,160,0.95);box-shadow:0 8px 40px rgba(0,0,0,0.12)"></div>
<div class="tb" style="position:relative"><i class="grab" style="background:rgba(255,255,255,0.5)"></i><span class="btn l" style="background:rgba(255,255,255,0.12);color:rgb(114,114,114)">✕</span><span class="ttl">Title</span><span class="btn r">↑</span></div>
</div>
<div class="lbl" style="left:1000px;top:470px;width:402px">Inspector · iPhone</div>
<div class="abs sheet" style="left:1500px;top:60px;width:936px;height:852px;border-radius:38px;box-shadow:0 15px 75px rgba(0,0,0,0.18)">
<div class="tb"><i class="grab"></i><span class="btn l">✕</span><span class="ttl">Title</span><span class="btn r">↑</span></div></div>
<div class="lbl" style="left:1500px;top:940px;width:936px">Sheet · iPad</div>
<div class="abs" style="left:60px;top:1050px;width:100px;height:100px;background:rgba(0,0,0,0.2)"></div>
<div class="lbl" style="left:180px;top:1075px;text-align:left">Overlay · rgba(0,0,0,0.2)</div>
</div>
</body></html>
