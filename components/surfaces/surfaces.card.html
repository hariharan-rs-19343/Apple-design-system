<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:url(../../assets/wallpaper-ios26.jpg) center/cover;padding:16px;min-height:100vh}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.grid{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}.glass{width:200px;height:160px;border-radius:34px;background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,0.12),inset 0 1px 1px rgba(255,255,255,0.9)}.wid{width:170px;height:170px;border-radius:26px;margin-top:14px;background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);padding:14px;display:flex;flex-direction:column;justify-content:space-between}.wid .h{font-size:13px;font-weight:590;color:rgb(255,56,60);text-transform:uppercase}.wid .b{font-size:40px;font-weight:300;line-height:1;color:#000}.win{height:300px;border-radius:26px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.25);overflow:hidden;position:relative}.wc{position:absolute;left:14px;top:14px;display:flex;gap:8px}.wc i{width:12px;height:12px;border-radius:50%}.wt{height:52px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:590}.wr{position:absolute;right:6px;bottom:6px;width:18px;height:18px;border-right:4px solid rgba(60,60,67,0.3);border-bottom:4px solid rgba(60,60,67,0.3);border-radius:0 0 14px 0}.l2{font-size:11px;font-weight:590;color:rgb(26,26,26);text-align:center;margin-top:6px}</style></head><body><div class="grid"><div><div class="glass"></div><div class="l2">Liquid Glass · Regular large</div><div class="wid"><span class="h">Tuesday</span><span class="b">9</span></div><div class="l2">Widget · iPhone small</div></div>
<div><div class="win"><div class="wc"><i style="background:rgb(255,95,87)"></i><i style="background:rgb(254,188,46)"></i><i style="background:rgb(40,200,64)"></i></div><div class="wt">Window</div><div class="wr"></div></div><div class="l2">iPad window · controls / resize</div></div></div></body></html>
