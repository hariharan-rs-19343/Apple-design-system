<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);padding:16px}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.t{background:#fff;border-radius:16px;min-height:96px;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px}.ic{width:60px;height:60px;border-radius:13.5px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.08)}.row{width:100%;height:110px;border-radius:16px;background:url(../../assets/wallpaper-ios26.jpg) center/cover;display:flex;justify-content:center;align-items:center;gap:28px}.row .c{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:510;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.25)}.row .ic{background:rgba(255,255,255,0.75)}.btn{height:50px;border-radius:100px;padding:0 20px;display:flex;align-items:center;font-size:17px;font-weight:590;background:rgba(120,120,128,0.16)}</style></head><body><div class="grid">
<div><div class="t"><span class="ic" style="background:#fff"></span><span class="ic" style="background:rgb(28,28,30)"></span><span class="ic" style="background:linear-gradient(rgb(60,60,67),rgb(28,28,30))"></span><span class="ic" style="background:linear-gradient(rgb(23,190,251),rgb(25,118,245))"></span></div><div class="lbl">App icon · Light / Dark / Tinted · App Store</div></div>
<div><div class="t"><span class="btn" style="color:rgb(0,136,255)">Action</span><span class="btn" style="color:rgb(255,56,60)">Action</span><span class="btn" style="color:rgba(60,60,67,0.3)">Action</span></div><div class="lbl">Buttons · Default / Destructive / Disabled</div></div>
<div style="grid-column:span 2"><div class="row"><div class="c"><span class="ic"></span>Name</div><div class="c"><span class="ic"></span>Name</div><div class="c"><span class="ic"></span>Name</div><div class="c"><span class="ic"></span>Name</div></div><div class="lbl">App icon row · iPhone (4 icons)</div></div>
</div></body></html>
