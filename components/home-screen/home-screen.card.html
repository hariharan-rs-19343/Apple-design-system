<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;background:rgb(245,245,245);display:flex;justify-content:center;padding:12px}
.cc{position:relative;width:402px;height:538px;overflow:hidden;border-radius:40px;zoom:0.6;background:url(../../assets/wallpaper-ios26.jpg) center/cover}

.sym{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"SF Pro",-apple-system,system-ui,sans-serif;color:#fff}
.m{position:absolute;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
.t{position:absolute;font-size:15px;line-height:20px;letter-spacing:-0.24px;font-weight:590;color:#fff}
.d{color:rgba(235,235,245,0.6);font-weight:400}
