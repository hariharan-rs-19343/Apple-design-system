<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);padding:16px;min-height:100vh}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{background:#fff;border-radius:26px;overflow:hidden}.r{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;font-size:17px;line-height:22px;letter-spacing:-0.43px}.r+.r:before{content:"";position:absolute;top:0;right:0;left:16px;height:0.5px;background:rgba(60,60,67,0.29)}.k{width:90px;color:#000}.v{flex:1;color:#000}.ph{color:rgba(60,60,67,0.3)}.cur{display:inline-block;width:2px;height:22px;background:rgb(0,136,255);border-radius:1px;vertical-align:-5px;margin-left:1px}.clr{width:18px;height:18px;border-radius:50%;background:rgba(60,60,67,0.3);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}.fld{height:44px;border-radius:100px;background:rgba(120,120,128,0.12);padding:0 14px;display:flex;align-items:center;font-size:17px;color:rgba(60,60,67,0.3)}.col{display:flex;flex-direction:column;gap:12px}.pill{height:34px;border-radius:6px;background:rgba(118,118,128,0.12);padding:6px 11px;font-size:17px;line-height:22px}.dt{display:flex;gap:6px}</style></head><body><div class="grid"><div><div class="list">

</div><div class="lbl">Row · Placeholder / Typing / Value entered</div></div>
