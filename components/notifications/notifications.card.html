<!-- @dsCard group="Components" viewport="700x300" name="Notifications" subtitle="Lock Screen notification, stacked group, and banner — Liquid Glass over wallpaper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:url(../../assets/wallpaper-ios26.jpg) center/cover;padding:16px;min-height:100vh}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.wrap{display:flex;flex-direction:column;gap:10px;align-items:center}.n{width:377px;border-radius:24px;padding:14px;display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,0.6);backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,0.12)}.ai{width:38px;height:38px;border-radius:9px;background:rgb(255,255,255);flex-shrink:0;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.1)}.c{flex:1;min-width:0}.h{display:flex;justify-content:space-between;font-size:15px;line-height:20px;font-weight:590;color:#000;letter-spacing:-0.23px}.h span{font-weight:400;font-size:13px;color:rgba(60,60,67,0.6)}.b{font-size:15px;line-height:20px;color:#000;letter-spacing:-0.23px}.st{position:relative;height:110px;width:377px}.st .n{position:absolute;left:0;top:0;z-index:3}.st i{position:absolute;border-radius:17px;background:rgba(255,255,255,0.45);backdrop-filter:blur(30px)}.dark .n{background:rgba(30,30,30,0.7)}.dark .h,.dark .b{color:#fff}.dark .h span{color:rgba(235,235,245,0.6)}</style></head><body><div class="wrap">
<div class="n"><span class="ai"></span><div class="c"><div class="h">Title<span>now</span></div><div class="b">Notification body text that can wrap onto a second line.</div></div></div>
<div class="st"><div class="n"><span class="ai"></span><div class="c"><div class="h">Title<span>2m ago</span></div><div class="b">Stacked notification</div></div></div><i style="left:22px;right:22px;top:66px;height:31px;z-index:2"></i><i style="left:57px;right:57px;top:83px;height:25px;border-radius:13.5px;z-index:1"></i></div>
<div class="dark"><div class="n"><span class="ai" style="background:rgb(28,28,30)"></span><div class="c"><div class="h">Title<span>9:41 AM</span></div><div class="b">Dark mode notification</div></div></div></div>
</div></body></html>
