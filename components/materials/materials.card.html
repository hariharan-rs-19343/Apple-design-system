<!-- @dsCard group="Components" viewport="700x330" name="Materials" subtitle="Ultrathin → Chrome blur materials, light and dark, over wallpaper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;background:url(../../assets/wallpaper-ios26.jpg) center/cover;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.m{height:100px;border-radius:24px;display:flex;align-items:flex-end;padding:12px;overflow:hidden}
.m span{font-size:13px;font-weight:590;letter-spacing:-0.08px}
.l span{color:rgb(0,0,0)}.d span{color:rgb(255,255,255)}
.grab{display:flex;justify-content:center}
.grab i{width:36px;height:5px;border-radius:100px;background:rgba(60,60,67,0.3)}
</style></head><body>
<div class="row">
<div class="m l" style="background:linear-gradient(rgba(255,255,255,0.03),rgba(255,255,255,0.03)),linear-gradient(rgba(255,255,255,0.07),rgba(255,255,255,0.07));backdrop-filter:blur(100px)"><span>Ultrathin</span></div>
<div class="m l" style="background:linear-gradient(rgba(255,255,255,0.4),rgba(255,255,255,0.4)),linear-gradient(rgba(255,255,255,0.05),rgba(255,255,255,0.05));backdrop-filter:blur(100px)"><span>Thin</span></div>
<div class="m l" style="background:linear-gradient(rgba(255,255,255,0.6),rgba(255,255,255,0.6)),linear-gradient(rgba(255,255,255,0.25),rgba(255,255,255,0.25));backdrop-filter:blur(100px)"><span>Regular</span></div>
<div class="m l" style="background:linear-gradient(rgba(255,255,255,0.84),rgba(255,255,255,0.84)),linear-gradient(rgba(255,255,255,0.34),rgba(255,255,255,0.34));backdrop-filter:blur(100px)"><span>Thick</span></div>
<div class="m l" style="background:rgba(255,255,255,0.75);backdrop-filter:blur(50px)"><span>Chrome</span></div>
</div>
<div class="row">
<div class="m d" style="background:rgba(0,0,0,0.02);backdrop-filter:blur(100px)"><span>Ultrathin</span></div>
<div class="m d" style="background:rgba(0,0,0,0.26);backdrop-filter:blur(100px)"><span>Thin</span></div>
<div class="m d" style="background:rgba(0,0,0,0.41);backdrop-filter:blur(100px)"><span>Regular</span></div>
<div class="m d" style="background:rgba(0,0,0,0.6);backdrop-filter:blur(100px)"><span>Thick</span></div>
<div class="m d" style="background:linear-gradient(rgba(124,124,124,0.35),rgba(124,124,124,0.35)),linear-gradient(rgba(28,28,28,0.9),rgba(28,28,28,0.9));backdrop-filter:blur(100px)"><span>Chrome</span></div>
</div>
<div class="grab"><i></i></div>
</body></html>
