<!-- @dsCard group="Components" viewport="700x240" name="Controls" subtitle="Checkmark, chevron, disclosure, close button, arrows — light and dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;background:rgb(245,245,245);padding:20px;display:flex;flex-direction:column;gap:18px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.tile{width:100%;height:72px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:16px;background:#fff}
.tile.dk{background:#000}.tile.el{background:rgb(28,28,30)}
.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center}
.g{font-family:"SF Pro",-apple-system,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.chk{font-size:17px;font-weight:590;color:rgb(0,136,255);width:22px;height:22px}
.chk.off{color:rgba(60,60,67,0.3)}
.chev{font-size:17px;font-weight:590;color:rgba(60,60,67,0.3);width:12px;height:22px}
.dk .chev,.el .chev{color:rgba(235,235,245,0.3)}
.dis{font-size:15px;font-weight:590;color:rgb(0,136,255);width:22px;height:22px;transition:transform .2s}
.dis.open{transform:rotate(90deg)}
.dis.gray{color:rgba(60,60,67,0.3)}
.x{width:30px;height:30px;border-radius:1000px;background:rgba(120,120,128,0.16)}
.x span{font-size:14px;font-weight:700;color:rgba(60,60,67,0.6)}
.dk .x{background:rgba(120,120,128,0.32)}.el .x{background:rgba(120,120,128,0.36)}
.dk .x span,.el .x span{color:rgba(235,235,245,0.6)}
.arr{font-size:13px;font-weight:590;color:rgb(0,136,255);width:16px;height:22px}
.arr.off{color:rgba(60,60,67,0.3)}
</style></head><body>
<div class="row">
<div class="cell"><div class="tile"><span class="g chk">􀆅</span><span class="g chk off">􀆅</span></div><div class="lbl">Checkmark · On / Disabled</div></div>
<div class="cell"><div class="tile"><span class="g chev">􀆊</span></div><div class="lbl">Chevron</div></div>
<div class="cell"><div class="tile"><span class="g dis">􀆊</span><span class="g dis open">􀆊</span></div><div class="lbl">Disclosure · Closed / Open</div></div>
<div class="cell"><div class="tile"><span class="g dis gray">􀆊</span><span class="g dis gray open">􀆊</span></div><div class="lbl">Sidebar Disclosure</div></div>
<div class="cell"><div class="tile"><span class="g x"><span>􀆄</span></span></div><div class="lbl">Close Button</div></div>
<div class="cell"><div class="tile"><span class="g arr">􀆇</span><span class="g arr">􀆈</span><span class="g arr off">􀆈</span></div><div class="lbl">Arrows · On / Off</div></div>
</div>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="cell"><div class="tile dk"><span class="g chev">􀆊</span></div><div class="lbl">Chevron · Dark</div></div>
<div class="cell"><div class="tile el"><span class="g chev">􀆊</span></div><div class="lbl">Chevron · Dark Elevated</div></div>
<div class="cell"><div class="tile dk"><span class="g x"><span>􀆄</span></span></div><div class="lbl">Close · Dark</div></div>
<div class="cell"><div class="tile el"><span class="g x"><span>􀆄</span></span></div><div class="lbl">Close · Dark Elevated</div></div>
</div>
</body></html>
