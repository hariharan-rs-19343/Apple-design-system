<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);padding:16px;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{border-radius:16px;height:150px;display:flex;align-items:center;justify-content:center;gap:28px;background:url(../../assets/wallpaper-ios26.jpg) center/cover}
.t.dk{background:linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),url(../../assets/wallpaper-ios26.jpg) center/cover}
.a{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.a img{width:64px;height:64px;border-radius:14.4px;display:block}
.a.ipad img{width:74px;height:74px;border-radius:16.6px}
.a span{font-size:12px;font-weight:510;line-height:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.bd{position:absolute;right:-9px;top:-9px;min-width:24px;height:24px;padding:0 7px;border-radius:100px;background:rgb(255,56,60);color:#fff;font-size:15px;line-height:24px;text-align:center;font-weight:400}
.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}</style></head><body>
<div><div class="t"><div class="a"><img src="../../assets/app-icon-light.png" alt=""><span>App Name</span></div><div class="a"><img src="../../assets/app-icon-light.png" alt=""><span>App Name</span><b class="bd">67</b></div><div class="a ipad"><img src="../../assets/app-icon-light.png" alt=""><span>iPad</span></div></div><div class="lbl">Light · iPhone / Badge / iPad</div></div>
<div><div class="t dk"><div class="a"><img src="../../assets/app-icon-dark.png" alt=""><span>App Name</span></div><div class="a"><img src="../../assets/app-icon-dark.png" alt=""><span>App Name</span><b class="bd">67</b></div><div class="a ipad"><img src="../../assets/app-icon-dark.png" alt=""><span>iPad</span></div></div><div class="lbl">Dark · iPhone / Badge / iPad</div></div>
</body></html>
