<!-- @dsCard group="Components" viewport="700x420" name="Alerts & Action Sheets" subtitle="System alert dialog and action sheet with Liquid Glass" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;background:url(../../assets/wallpaper-ios26.jpg) center/cover;min-height:100vh;display:flex;gap:24px;padding:24px;justify-content:center;align-items:flex-start}</style>
</head><body>
<!-- Stacked Alert -->
<div style="width:270px;border-radius:26px;background:rgba(160,160,160,0.72);backdrop-filter:blur(50px);padding:20px 16px 12px;display:flex;flex-direction:column;gap:0">
<div style="text-align:center;margin-bottom:14px">
<div style="font-size:17px;font-weight:600;color:rgb(0,0,0);line-height:22px;letter-spacing:-0.41px">A Short Title Is Best</div>
<div style="font-size:13px;font-weight:400;color:rgb(0,0,0);line-height:18px;letter-spacing:-0.08px;margin-top:4px">A description should be a short, complete sentence.</div>
</div>
<div style="height:0.5px;background:rgba(0,0,0,0.2);margin:0 -16px"></div>
<div style="margin:12px 0;display:flex;flex-direction:column;gap:6px">
<div style="background:rgba(120,120,120,0.18);border-radius:10px;padding:8px 12px">
<div style="font-size:17px;color:rgb(0,0,0);line-height:22px">Value</div>
</div>
<div style="background:rgba(120,120,120,0.18);border-radius:10px;padding:8px 12px">
<div style="font-size:17px;color:rgba(60,60,67,0.3);line-height:22px">Value</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
<div style="background:rgb(0,122,255);border-radius:100px;padding:12px;text-align:center">
<span style="font-size:17px;font-weight:600;color:#fff;letter-spacing:-0.41px">Primary</span>
</div>
<div style="background:rgba(120,120,120,0.18);border-radius:100px;padding:12px;text-align:center">
<span style="font-size:17px;font-weight:400;color:rgb(255,56,60);letter-spacing:-0.41px">Destructive</span>
</div>
<div style="background:rgba(120,120,120,0.18);border-radius:100px;padding:12px;text-align:center">
<span style="font-size:17px;font-weight:600;color:rgb(0,0,0);letter-spacing:-0.41px">Secondary</span>
</div>
</div>
</div>
<!-- Side-by-side Alert -->
<div style="width:270px;border-radius:26px;background:rgba(160,160,160,0.72);backdrop-filter:blur(50px);padding:20px 16px 12px;display:flex;flex-direction:column;gap:0">
<div style="text-align:center;margin-bottom:14px">
<div style="font-size:17px;font-weight:600;color:rgb(0,0,0);line-height:22px;letter-spacing:-0.41px">A Short Title Is Best</div>
<div style="font-size:13px;font-weight:400;color:rgb(0,0,0);line-height:18px;letter-spacing:-0.08px;margin-top:4px">A description should be a short, complete sentence.</div>
</div>
<div style="height:0.5px;background:rgba(0,0,0,0.2);margin:0 -16px"></div>
<div style="margin:12px 0;display:flex;flex-direction:column;gap:6px">
<div style="background:rgba(120,120,120,0.18);border-radius:10px;padding:8px 12px">
<div style="font-size:17px;color:rgb(0,0,0);line-height:22px">Value</div>
</div>
<div style="background:rgba(120,120,120,0.18);border-radius:10px;padding:8px 12px">
<div style="font-size:17px;color:rgba(60,60,67,0.3);line-height:22px">Value</div>
</div>
</div>
<div style="display:flex;gap:8px;margin-top:4px">
<div style="flex:1;background:rgba(120,120,120,0.18);border-radius:100px;padding:12px;text-align:center">
<span style="font-size:17px;font-weight:600;color:rgb(0,0,0);letter-spacing:-0.41px">Secondary</span>
</div>
<div style="flex:1;background:rgb(0,122,255);border-radius:100px;padding:12px;text-align:center">
<span style="font-size:17px;font-weight:600;color:#fff;letter-spacing:-0.41px">Primary</span>
</div>
</div>
</div>
</body></html>
