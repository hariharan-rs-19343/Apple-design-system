<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:url(../../assets/wallpaper-ios26.jpg) center/cover;padding:16px;min-height:100vh}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sheet{background:rgba(255,255,255,0.85);backdrop-filter:blur(30px);border-radius:34px;padding:16px;display:flex;flex-direction:column;gap:14px}.hd{display:flex;gap:12px;align-items:center}.thumb{width:44px;height:44px;border-radius:10px;background:rgb(242,242,247)}.hd .t{font-size:15px;font-weight:590}.hd .s{font-size:13px;color:rgba(60,60,67,0.6)}.x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(120,120,128,0.16);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:rgba(60,60,67,0.6)}.apps{display:flex;gap:16px}.apps div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}.apps i{width:60px;height:60px;border-radius:13.5px;background:#fff;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.1)}.act{background:#fff;border-radius:16px}.act div{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;position:relative}.act div+div:before{content:"";position:absolute;top:0;left:16px;right:0;height:0.5px;background:rgba(60,60,67,0.29)}.col{display:flex;flex-direction:column;gap:12px}.t2{background:#fff;border-radius:16px;min-height:90px;display:flex;align-items:center;justify-content:center;gap:24px}.pop{display:flex;gap:4px;align-items:center;font-size:17px;font-weight:590;color:rgb(0,136,255)}.fid{width:76px;height:76px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:center;color:rgb(52,199,89);font-size:40px}.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px}.sws i{aspect-ratio:1;border-radius:50%}.l2{font-size:11px;font-weight:590;color:rgb(26,26,26);text-align:center;margin-top:6px}</style></head><body><div class="grid"><div><div class="sheet"><div class="hd"><span class="thumb"></span><div><div class="t">Title</div><div class="s">Subtitle</div></div><span class="x sf">􀆄</span></div><div class="apps"><div><i></i>App</div><div><i></i>App</div><div><i></i>App</div><div><i></i>App</div></div><div class="act"><div>Copy<span class="sf">􀉁</span></div><div>Add to Favorites<span class="sf">􀋃</span></div></div></div><div class="l2">Activity view</div></div>
<div class="col"><div class="t2"><span class="pop">Label<span class="sf" style="font-size:13px">􀆏</span></span><span class="fid sf">􀎽</span></div><div class="l2" style="margin-top:-6px">Pop-up button · Face ID</div>
<div class="t2" style="display:block"><div class="sws"><i style="background:rgb(255,56,60)"></i><i style="background:rgb(255,141,40)"></i><i style="background:rgb(255,204,0)"></i><i style="background:rgb(52,199,89)"></i><i style="background:rgb(0,195,208)"></i><i style="background:rgb(0,136,255)"></i><i style="background:rgb(97,85,245)"></i><i style="background:rgb(203,48,224)"></i><i style="background:rgb(255,45,85)"></i><i style="background:rgb(172,127,94)"></i><i style="background:rgb(142,142,147)"></i><i style="background:rgb(0,0,0)"></i></div></div><div class="l2" style="margin-top:-6px">Color picker swatches</div></div></div></body></html>
