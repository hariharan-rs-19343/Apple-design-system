<!-- @dsCard group="Components" viewport="700x400" name="Buttons" subtitle="Bordered, borderless, liquid glass — blue and destructive variants" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;background:rgb(245,245,245);padding:24px;display:flex;flex-direction:column;gap:24px}</style>
</head><body>
<!-- Liquid Glass buttons -->
<div style="display:flex;gap:16px;align-items:center;justify-content:center">
<div style="height:48px;padding:6px 20px;border-radius:1000px;display:flex;align-items:center;justify-content:center;background:rgb(247,247,247);box-shadow:0 8px 40px 0 rgba(0,0,0,0.12),inset 0 1px 1px rgba(255,255,255,0.9),inset 0 -1px 1px rgba(0,0,0,0.03);backdrop-filter:blur(7px)">
<span style="font-size:17px;font-weight:510;line-height:100%;color:rgb(26,26,26)">Label</span>
</div>
<div style="height:48px;padding:6px 20px;border-radius:1000px;display:flex;align-items:center;justify-content:center;background:rgb(0,145,255);box-shadow:0 8px 40px 0 rgba(0,0,0,0.12),inset 0 1px 1px rgba(255,255,255,0.35),inset 0 -1px 1px rgba(0,0,0,0.06)">
<span style="font-size:17px;font-weight:590;line-height:100%;color:rgb(255,255,255)">Label</span>
</div>
<div style="width:48px;height:48px;border-radius:1000px;display:flex;align-items:center;justify-content:center;background:rgb(247,247,247);box-shadow:0 8px 40px 0 rgba(0,0,0,0.12),inset 0 1px 1px rgba(255,255,255,0.9),inset 0 -1px 1px rgba(0,0,0,0.03)">
<span style="font-size:19px;font-weight:590;line-height:22px;color:rgb(26,26,26)">✓</span>
</div>
<div style="width:48px;height:48px;border-radius:1000px;display:flex;align-items:center;justify-content:center;background:rgb(0,145,255);box-shadow:0 8px 40px 0 rgba(0,0,0,0.12),inset 0 1px 1px rgba(255,255,255,0.35),inset 0 -1px 1px rgba(0,0,0,0.06)">
<span style="font-size:19px;font-weight:590;line-height:22px;color:rgb(255,255,255)">✓</span>
</div>
</div>
<!-- Bordered Prominent (icon + text) — 3 sizes, blue -->
<div>
<div style="font-size:11px;font-weight:600;color:rgba(60,60,67,0.6);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Bordered Prominent</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<div style="background:rgb(0,122,255);border-radius:100px;padding:8px 16px;display:flex;gap:5px;align-items:center"><span style="font-size:13px;color:#fff">▶</span><span style="font-size:15px;font-weight:500;color:#fff">Play</span></div>
<div style="background:rgb(0,122,255);border-radius:100px;padding:10px 20px;display:flex;gap:5px;align-items:center"><span style="font-size:15px;color:#fff">▶</span><span style="font-size:17px;font-weight:500;color:#fff">Play</span></div>
<div style="background:rgb(0,122,255);border-radius:100px;padding:14px 28px;display:flex;gap:6px;align-items:center"><span style="font-size:17px;color:#fff">▶</span><span style="font-size:19px;font-weight:500;color:#fff">Play</span></div>
<!-- Disabled -->
<div style="background:rgba(116,116,128,0.08);border-radius:100px;padding:8px 16px;display:flex;gap:5px;align-items:center;opacity:1"><span style="font-size:13px;color:rgba(60,60,67,0.18)">▶</span><span style="font-size:15px;font-weight:500;color:rgba(60,60,67,0.18)">Play</span></div>
<div style="background:rgba(116,116,128,0.08);border-radius:100px;padding:10px 20px;display:flex;gap:5px;align-items:center"><span style="font-size:15px;color:rgba(60,60,67,0.18)">▶</span><span style="font-size:17px;font-weight:500;color:rgba(60,60,67,0.18)">Play</span></div>
</div>
</div>
<!-- Bordered Secondary -->
<div>
<div style="font-size:11px;font-weight:600;color:rgba(60,60,67,0.6);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Bordered Secondary</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<div style="background:rgba(116,116,128,0.08);border-radius:100px;padding:8px 16px;display:flex;gap:5px;align-items:center"><span style="font-size:13px;color:rgb(0,122,255)">▶</span><span style="font-size:15px;font-weight:500;color:rgb(0,122,255)">Play</span></div>
<div style="background:rgba(116,116,128,0.08);border-radius:100px;padding:10px 20px;display:flex;gap:5px;align-items:center"><span style="font-size:15px;color:rgb(0,122,255)">▶</span><span style="font-size:17px;font-weight:500;color:rgb(0,122,255)">Play</span></div>
<div style="background:rgba(116,116,128,0.08);border-radius:100px;padding:14px 28px;display:flex;gap:5px;align-items:center"><span style="font-size:17px;color:rgb(0,122,255)">▶</span><span style="font-size:19px;font-weight:500;color:rgb(0,122,255)">Play</span></div>
</div>
</div>
<!-- Borderless -->
<div>
<div style="font-size:11px;font-weight:600;color:rgba(60,60,67,0.6);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Borderless</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<div style="padding:8px 12px;display:flex;gap:5px;align-items:center"><span style="font-size:13px;color:rgb(0,122,255)">▶</span><span style="font-size:15px;font-weight:500;color:rgb(0,122,255)">Play</span></div>
<div style="padding:10px 16px;display:flex;gap:5px;align-items:center"><span style="font-size:15px;color:rgb(0,122,255)">▶</span><span style="font-size:17px;font-weight:500;color:rgb(0,122,255)">Play</span></div>
</div>
</div>
<!-- Destructive row -->
<div>
<div style="font-size:11px;font-weight:600;color:rgba(60,60,67,0.6);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Destructive</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<div style="background:rgba(255,56,60,0.14);border-radius:100px;padding:8px 16px;display:flex;gap:5px;align-items:center"><span style="font-size:13px;color:rgb(255,56,60)">▶</span><span style="font-size:15px;font-weight:500;color:rgb(255,56,60)">Play</span></div>
<div style="background:rgba(255,56,60,0.14);border-radius:100px;padding:10px 20px;display:flex;gap:5px;align-items:center"><span style="font-size:15px;color:rgb(255,56,60)">▶</span><span style="font-size:17px;font-weight:500;color:rgb(255,56,60)">Play</span></div>
<div style="padding:10px 16px;display:flex;gap:5px;align-items:center"><span style="font-size:15px;color:rgb(255,56,60)">▶</span><span style="font-size:17px;font-weight:500;color:rgb(255,56,60)">Play</span></div>
</div>
</div>
</body></html>
