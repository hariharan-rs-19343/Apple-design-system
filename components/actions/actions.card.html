<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);padding:16px}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.t{background:#fff;border-radius:16px;min-height:72px;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}.t.dk{background:#000}.g{height:36px;min-width:36px;border-radius:100px;padding:0 12px;display:flex;align-items:center;gap:4px;font-size:17px;font-weight:510;line-height:1;color:rgb(64,64,64);background:rgb(247,247,247);box-shadow:0 8px 40px rgba(0,0,0,0.12),inset 0 1px 1px rgba(255,255,255,0.9)}.g.pri{background:rgb(0,136,255);color:#fff;font-weight:590}.g.off{color:rgb(191,191,191)}.e{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}.sw{display:flex;height:52px;border-radius:26px;overflow:hidden;width:100%}.sw .row{flex:1;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:17px}.sw .a{width:74px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px}.as{width:100%;border-radius:26px;background:rgb(44,44,46);overflow:hidden}.as div{height:56px;display:flex;align-items:center;justify-content:center;font-size:17px;border-top:0.33px solid rgba(84,84,88,0.65)}.as div:first-child{border-top:0}</style></head><body><div class="grid">
<div><div class="t"><span class="g"><span class="sf">􀯶</span>Label</span><span class="g">Label</span><span class="g pri">Label</span></div><div class="lbl">Top · Back / Text / Primary</div></div>
<div><div class="t"><span class="g"><span class="sf">􀯶</span>Label</span><span class="g off"><span class="sf">􀯶</span>Label</span></div><div class="lbl">Back button · Default / Disabled</div></div>
<div><div class="t" style="background:#f2f2f7;padding:12px 0"><div class="sw"><div class="row">Swipe to reveal</div><div class="a sf" style="background:rgb(255,141,40)">􀋉</div><div class="a sf" style="background:rgb(0,136,255)">􀍠</div><div class="a sf" style="background:rgb(255,56,60)">􀈑</div></div></div><div class="lbl">Swipe actions</div></div>
<div><div class="t dk"><span class="e" style="box-shadow:inset 0 0 0 1.5px rgba(235,235,245,0.3)"></span><span class="e sf" style="background:rgb(0,145,255)">􀆅</span><span class="e sf" style="background:rgb(48,209,88)">􀅼</span><span class="e sf" style="background:rgb(255,66,69)">􀅽</span></div><div class="lbl">Edit buttons · Unselected / Selected / Add / Remove</div></div>
<div style="grid-column:span 2"><div class="t dk"><div class="as" style="max-width:360px"><div style="color:rgb(0,145,255)">Action</div><div style="color:rgb(255,66,69)">Action</div><div style="color:rgba(235,235,245,0.3)">Action</div></div></div><div class="lbl">Action sheet buttons · Default / Destructive / Disabled</div></div>
</div></body></html>
