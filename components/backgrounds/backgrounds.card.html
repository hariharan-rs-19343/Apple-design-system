<!-- @dsCard group="Components" viewport="700x330" name="Backgrounds" subtitle="System, grouped and elevated backgrounds — light and dark; top/bottom gradients" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:rgb(245,245,245);padding:16px}.sf{font-family:"SF Pro",-apple-system,system-ui,sans-serif}.lbl{font-size:11px;color:rgba(60,60,67,0.6);text-align:center;margin-top:6px}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grp{display:flex;flex-direction:column;gap:6px}.gt{font-size:11px;color:rgba(60,60,67,0.6)}.p{border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.b{height:56px;border-radius:12px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.1)}.n{font-size:11px;margin-top:4px;text-align:center}.dk .n{color:rgba(235,235,245,0.6)!important}.grad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.g{height:72px;border-radius:12px;background:url(../../assets/wallpaper-ios26.jpg) center/cover;position:relative;overflow:hidden}.g i{position:absolute;left:0;right:0;height:50%}</style></head><body><div class="wrap">
<div class="grp"><div class="gt">System · Light</div><div class="p" style="background:rgb(229,229,234)"><div><div class="b" style="background:rgb(255,255,255)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Primary</div></div><div><div class="b" style="background:rgb(242,242,247)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Secondary</div></div><div><div class="b" style="background:rgb(255,255,255)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Tertiary</div></div></div></div>
<div class="grp dk"><div class="gt">System · Dark</div><div class="p" style="background:rgb(18,18,18)"><div><div class="b" style="background:rgb(0,0,0)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Primary</div></div><div><div class="b" style="background:rgb(28,28,30)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Secondary</div></div><div><div class="b" style="background:rgb(44,44,46)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Tertiary</div></div></div></div>
<div class="grp"><div class="gt">Grouped · Light</div><div class="p" style="background:rgb(229,229,234)"><div><div class="b" style="background:rgb(242,242,247)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Primary</div></div><div><div class="b" style="background:rgb(255,255,255)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Secondary</div></div><div><div class="b" style="background:rgb(242,242,247)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Tertiary</div></div></div></div>
<div class="grp dk"><div class="gt">Elevated · Dark</div><div class="p" style="background:rgb(18,18,18)"><div><div class="b" style="background:rgb(28,28,30)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Primary</div></div><div><div class="b" style="background:rgb(44,44,46)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Secondary</div></div><div><div class="b" style="background:rgb(58,58,60)"></div><div class="n" style="color:rgba(60,60,67,0.6)">Tertiary</div></div></div></div>
</div>
<div class="grad">
<div><div class="g"><i style="top:0;background:linear-gradient(rgba(255,255,255,0.8),rgba(255,255,255,0))"></i></div><div class="lbl">Gradient · Light top</div></div>
<div><div class="g"><i style="bottom:0;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,0.8))"></i></div><div class="lbl">Gradient · Light bottom</div></div>
<div><div class="g"><i style="top:0;background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0))"></i></div><div class="lbl">Gradient · Dark top</div></div>
<div><div class="g"><i style="bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0.6))"></i></div><div class="lbl">Gradient · Dark bottom</div></div>
</div></body></html>
