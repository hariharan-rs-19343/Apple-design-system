<!-- @dsCard group="Colors" viewport="700x280" name="Semantic Colors" subtitle="Labels, backgrounds, fills, separators" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:'Zoho Puvi','SF Pro',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div>
<div style="font-size:11px;font-weight:600;color:var(--labels-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">Labels</div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:8px;background:var(--labels-primary)"></div><span style="color:var(--labels-secondary)">Primary</span></div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:8px;background:var(--labels-secondary)"></div><span style="color:var(--labels-secondary)">Secondary</span></div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:8px;background:var(--labels-tertiary)"></div><span style="color:var(--labels-secondary)">Tertiary</span></div>
<div style="display:flex;gap:8px;align-items:center"><div style="width:32px;height:32px;border-radius:8px;background:var(--labels-quaternary)"></div><span style="color:var(--labels-secondary)">Quaternary</span></div>
</div>
<div>
<div style="font-size:11px;font-weight:600;color:var(--labels-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">Backgrounds</div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:8px;background:var(--backgrounds-primary);border:1px solid var(--separators-opaque)"></div><span style="color:var(--labels-secondary)">Primary</span></div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:8px;background:var(--backgrounds-secondary);border:1px solid var(--separators-opaque)"></div><span style="color:var(--labels-secondary)">Secondary</span></div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:8px;background:var(--backgrounds-tertiary);border:1px solid var(--separators-opaque)"></div><span style="color:var(--labels-secondary)">Tertiary</span></div>
<div style="display:flex;gap:8px;align-items:center"><div style="width:32px;height:32px;border-radius:8px;background:var(--backgrounds-grouped-primary);border:1px solid var(--separators-opaque)"></div><span style="color:var(--labels-secondary)">Grouped</span></div>
</div>
</div>
</body></html>
