<!-- @dsCard group="Colors" viewport="700x200" name="Fills & Overlays" subtitle="System fill tokens and overlay values" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:'Zoho Puvi','SF Pro',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:11px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--fills-primary)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Fill Primary</div></div>
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--fills-secondary)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Fill Secondary</div></div>
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--fills-tertiary)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Fill Tertiary</div></div>
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--fills-quaternary)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Fill Quaternary</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px">
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--separators-opaque)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Separator Opaque</div></div>
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--separators-non-opaque);border:1px solid var(--separators-opaque)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Separator Non-opaque</div></div>
<div><div style="width:100%;height:48px;border-radius:10px;background:var(--overlays-default)"></div><div style="color:rgba(60,60,67,0.6);text-align:center;margin-top:4px">Overlay Default</div></div>
</div>
</body></html>
