<!-- @dsCard group="Colors" viewport="960x150" name="ZhareHub Primary Scale" subtitle="#226DB4 tonal ramp, 50–900" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:#fff;font-family:'Zoho Puvi','SF Pro',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.ramp{display:grid;grid-template-columns:repeat(10,1fr);border-radius:12px;overflow:hidden}
.s{height:72px;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px;gap:2px}
.s b{font-size:13px;font-weight:600}
.s span{font-family:'SF Mono',ui-monospace,monospace}
</style></head><body>
<div class="ramp">
<div class="s" style="background:var(--zh-primary-50);color:#0B2742"><b>50</b><span>#EEF5FC</span></div>
<div class="s" style="background:var(--zh-primary-100);color:#0B2742"><b>100</b><span>#D6E7F7</span></div>
<div class="s" style="background:var(--zh-primary-200);color:#0B2742"><b>200</b><span>#ADCFEF</span></div>
<div class="s" style="background:var(--zh-primary-300);color:#0B2742"><b>300</b><span>#7FB3E5</span></div>
<div class="s" style="background:var(--zh-primary-400);color:#0B2742"><b>400</b><span>#4F93D6</span></div>
<div class="s" style="background:var(--zh-primary-500);color:#fff"><b>500</b><span>#226DB4</span></div>
<div class="s" style="background:var(--zh-primary-600);color:#fff"><b>600</b><span>#1C5D9A</span></div>
<div class="s" style="background:var(--zh-primary-700);color:#fff"><b>700</b><span>#174C7E</span></div>
<div class="s" style="background:var(--zh-primary-800);color:#fff"><b>800</b><span>#113A61</span></div>
<div class="s" style="background:var(--zh-primary-900);color:#fff"><b>900</b><span>#0B2742</span></div>
</div>
</body></html>
