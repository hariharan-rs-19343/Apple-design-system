<!-- @dsCard group="Colors" viewport="700x200" name="Gray Scale" subtitle="System grays from Black to White" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:'Zoho Puvi','SF Pro',-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px">
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-black)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Black</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-gray)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Gray</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-gray-2)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Gray 2</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-gray-3)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Gray 3</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-gray-4)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Gray 4</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-gray-5);border:1px solid var(--separators-opaque)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Gray 5</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-gray-6);border:1px solid var(--separators-opaque)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">Gray 6</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:10px;background:var(--grays-white);border:1px solid var(--separators-opaque)"></div><div style="font-size:10px;color:var(--labels-secondary);text-align:center;margin-top:4px">White</div></div>
</div>
</body></html>
