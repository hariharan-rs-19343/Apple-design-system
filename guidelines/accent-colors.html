<!-- @dsCard group="Colors" viewport="700x280" name="Accent Colors" subtitle="12 system accent colors for light mode" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:'Zoho Puvi','SF Pro',-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-red)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Red</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-orange)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Orange</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-yellow)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Yellow</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-green)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Green</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-mint)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Mint</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-teal)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Teal</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-cyan)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Cyan</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-blue)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Blue</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-indigo)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Indigo</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-purple)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Purple</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-pink)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Pink</div></div>
<div><div style="width:100%;aspect-ratio:1;border-radius:50%;background:var(--accents-brown)"></div><div style="font-size:11px;color:var(--labels-secondary);text-align:center;margin-top:6px">Brown</div></div>
</div>
</body></html>
